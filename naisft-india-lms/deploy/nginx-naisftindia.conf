# Nginx site config for NAISFT INDIA on a VPS.
# Replace /var/www/naisft/NAISFT-INDIA with the actual repo path if different.
# Install at: /etc/nginx/sites-available/naisftindia.com
# Enable with: ln -s /etc/nginx/sites-available/naisftindia.com /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name naisftindia.com www.naisftindia.com;

    root /var/www/naisft/NAISFT-INDIA;
    index index.html;

    client_max_body_size 20m;

    # Backend API reverse proxy.
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Runtime uploads are served by the Node backend.
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Keep apply-online token protection from the current .htaccess behavior.
    location = /apply-online.html {
        if ($arg_token = "") {
            return 302 /index.html;
        }
        try_files $uri =404;
    }

    # Clean URL support for static HTML pages.
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    location ~ /\. {
        deny all;
    }
}

